algorithm: PPO
ticker: AAPL
policy: MlpPolicy
policy_kwargs:
  net_arch:
    pi: [256, 256, 128]
    vf: [256, 256, 128]
  activation_fn: ReLU
  ortho_init: true

hyperparameters:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true

training:
  total_timesteps: 1000000
  n_envs: 8
  eval_freq: 10000
  n_eval_episodes: 10
  save_best_model: true

curriculum:
  enabled: true
  stages: 3
