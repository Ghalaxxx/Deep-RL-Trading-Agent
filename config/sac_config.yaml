algorithm: SAC
ticker: SPY
policy: MlpPolicy
policy_kwargs:
  net_arch: [256, 256, 128]
  activation_fn: ReLU

hyperparameters:
  learning_rate: 3.0e-4
  buffer_size: 300000
  learning_starts: 5000
  batch_size: 256
  tau: 0.02
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1

training:
  total_timesteps: 1000000
  n_envs: 8
  eval_freq: 10000
  n_eval_episodes: 10
  save_best_model: true

curriculum:
  enabled: true
  stages: 3
